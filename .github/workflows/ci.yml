name: Node.js CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    strategy:
      matrix:
        os:
          - macos-26
          - macos-26-intel
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - windows-2025
          - windows-11-arm
        include:
          - os: macos-26
            display: MacOS 26 ARM
          - os: macos-26-intel
            display: MacOS 26 Intel
          - os: ubuntu-24.04
            display: Ubuntu 24.04 Intel
          - os: ubuntu-24.04-arm
            display: Ubuntu 24.04 ARM
          - os: windows-2025
            display: Windows 11 Intel
          - os: windows-11-arm
            display: Windows 11 (ARM)
      fail-fast: false
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.display }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "26.7.0"
          cache: "npm"

      - name: Setup npm
        run: npm i -g npm@12.0.2

      - name: Install third party dependencies
        run: npm ci --legacy-peer-deps

      - name: Check third party vulnerabilities
        run: npm audit

      - name: Check for formatting errors
        run: npm run format

      - name: Check for linting errors
        run: npm run lint

      - name: Diagnose NW.js shared library dependencies
        if: runner.os == 'Linux'
        run: node .github/config/diagnose.js

      - name: Diagnose usable virtual address space
        if: runner.os == 'Linux'
        run: |
          uname -m
          python3 - <<'PY'
          import mmap
          for tib in [1, 0.5, 0.25, 0.125, 0.0625]:
              size = int(tib * 1024 ** 4)
              try:
                  m = mmap.mmap(
                      -1,
                      size,
                      flags=mmap.MAP_PRIVATE | mmap.MAP_ANONYMOUS,
                      prot=0,
                  )
                  m.close()
                  print(f"{tib} TiB reservation: OK")
              except OSError as e:
                  print(f"{tib} TiB reservation: FAILED ({e})")
          PY

      - name: Run test suite
        run: npm run e2e
        env:
          CI: true
